<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden of Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;background:#faf6f0;color:#3a2e2e;min-height:100vh;padding:2rem 1rem 4rem;}
header{text-align:center;margin-bottom:2rem;}
header h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:0.04em;}
header h1 em{font-style:italic;color:#b5697a;}
header p{font-size:0.72rem;color:#9a8a8a;letter-spacing:0.14em;text-transform:uppercase;margin-top:0.4rem;}
.divider{width:60px;height:1px;background:#c9a96e;margin:0.8rem auto;opacity:0.6;}
.stats{display:flex;justify-content:center;gap:2.5rem;margin-bottom:1.8rem;}
.stat{text-align:center;}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:#8b4a4a;line-height:1;}
.stat-label{font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:#9a8a8a;margin-top:2px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:540px;margin:0 auto 1.5rem;}
.card{aspect-ratio:1;border-radius:16px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(.4,0,.2,1);}
.card:hover:not(.flipped):not(.matched){transform:translateY(-4px) scale(1.03);}
.card.flipped,.card.matched{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.card-back{background:#f0e8e2;border:1px solid rgba(181,105,122,0.2);}
.card-front{transform:rotateY(180deg);background:#fff;border:1px solid rgba(181,105,122,0.15);}
.card-front svg{width:80%;height:80%;}
.card-front .fname{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.72rem;color:#8b4a5a;padding-bottom:4px;}
.card.matched .card-front{background:#f5faf5;border-color:#7a9a7a;}
.card.matched .fname{color:#4a7a4a;}
.btn-row{text-align:center;margin-bottom:1rem;}
button{font-family:'Jost',sans-serif;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;background:transparent;border:1px solid #b5697a;color:#8b4a4a;padding:10px 28px;border-radius:30px;cursor:pointer;transition:all 0.2s;}
button:hover{background:#b5697a;color:white;}
button.btn-sm{font-size:0.62rem;padding:6px 16px;border-color:#9a8a8a;color:#9a8a8a;}
button.btn-sm:hover{background:#9a8a8a;color:white;}
.change-tiles{display:block;text-align:center;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:#9a8a8a;margin-bottom:1.8rem;cursor:pointer;text-decoration:none;}
.change-tiles:hover{color:#b5697a;}
.win-panel{display:none;text-align:center;padding:2.5rem 2rem;max-width:400px;margin:0 auto 2rem;}
.win-panel h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2rem;color:#8b4a4a;margin-bottom:0.5rem;}
.win-panel p{font-size:0.85rem;color:#9a8a8a;margin-bottom:1.5rem;}
.leaderboard{max-width:460px;margin:0 auto;border-top:1px solid rgba(181,105,122,0.2);padding-top:2rem;}
.lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.lb-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;font-weight:300;}
.lb-row{display:flex;align-items:center;padding:9px 14px;border-radius:10px;margin-bottom:4px;font-size:0.85rem;gap:6px;}
.lb-row.is-new{background:rgba(181,105,122,0.08);}
.lb-rank{width:28px;font-size:1.1rem;flex-shrink:0;}
.lb-user{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.lb-avatar{width:28px;height:28px;border-radius:50%;background:#f0e8e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lb-avatar svg{width:20px;height:20px;}
.lb-name{font-size:0.85rem;color:#3a2e2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-pts{font-size:0.85rem;color:#8b4a4a;font-weight:400;flex-shrink:0;}
.lb-detail{font-size:0.72rem;color:#9a8a8a;flex-shrink:0;}
.new-tag{font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;background:#b5697a;color:white;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
.empty-msg{text-align:center;font-size:0.85rem;color:#9a8a8a;font-style:italic;padding:1rem 0;}
.score-hint{text-align:center;font-size:0.7rem;color:#9a8a8a;margin-bottom:1.5rem;letter-spacing:0.05em;}
.status-msg{text-align:center;font-size:0.72rem;color:#9a8a8a;margin-bottom:0.5rem;min-height:1.2em;}

/* Modal overlay (profile + tile picker share this) */
.modal-overlay{position:fixed;inset:0;background:rgba(58,46,46,0.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;overflow-y:auto;padding:1rem;}
.modal-overlay.hidden{display:none;}
.modal{background:#faf6f0;border-radius:20px;padding:2.2rem 2rem 2rem;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(58,46,46,0.18);}
.modal h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.8rem;color:#8b4a4a;margin-bottom:0.3rem;}
.modal .sub{font-size:0.75rem;color:#9a8a8a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:1.4rem;}
.modal input{font-family:'Jost',sans-serif;font-size:0.9rem;width:100%;border:1px solid rgba(181,105,122,0.35);border-radius:30px;padding:10px 18px;background:#fff;color:#3a2e2e;outline:none;text-align:center;margin-bottom:1.4rem;}
.modal input:focus{border-color:#b5697a;}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.6rem;justify-items:center;}
.avatar-opt{width:48px;height:48px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;transition:all 0.2s;background:#f0e8e2;}
.avatar-opt:hover{transform:scale(1.1);}
.avatar-opt.selected{border-color:#b5697a;box-shadow:0 0 0 3px rgba(181,105,122,0.2);}
.avatar-opt svg{width:36px;height:36px;}

/* Tile set picker */
.tileset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:1.8rem;}
.tileset-card{border:2px solid rgba(181,105,122,0.2);border-radius:16px;padding:1rem 0.8rem 0.8rem;cursor:pointer;transition:all 0.2s;background:#fff;}
.tileset-card:hover{border-color:#b5697a;transform:translateY(-2px);}
.tileset-card.selected{border-color:#b5697a;background:#fdf5f7;box-shadow:0 0 0 3px rgba(181,105,122,0.15);}
.tileset-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:#8b4a4a;margin-bottom:0.5rem;}
.tileset-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.tileset-preview div{aspect-ratio:1;border-radius:4px;background:#f0e8e2;display:flex;align-items:center;justify-content:center;}
.tileset-preview svg{width:90%;height:90%;}
</style>
</head>
<body>

<!-- Profile modal -->
<div class="modal-overlay hidden" id="profile-overlay">
  <div class="modal">
    <h2>Welcome to the <em style="font-style:italic;color:#b5697a;">Garden</em></h2>
    <div class="sub">Choose your avatar &amp; enter your name</div>
    <div class="avatar-grid" id="avatar-grid"></div>
    <input type="text" id="modal-name" placeholder="Your name" maxlength="20" />
    <button onclick="saveProfile()">Continue</button>
  </div>
</div>

<!-- Tile set picker -->
<div class="modal-overlay hidden" id="tileset-overlay">
  <div class="modal" style="max-width:420px;">
    <h2>Choose your <em style="font-style:italic;color:#b5697a;">tiles</em></h2>
    <div class="sub">Select a set to play with</div>
    <div class="tileset-grid" id="tileset-grid"></div>
    <button onclick="confirmTileset()">Play</button>
  </div>
</div>

<header>
  <h1>Garden of <em>Memories</em></h1>
  <div class="divider"></div>
  <p id="header-sub">Find each matching pair</p>
</header>
<div class="stats">
  <div class="stat"><div class="stat-value" id="moves">0</div><div class="stat-label">Moves</div></div>
  <div class="stat"><div class="stat-value" id="pairs">0/8</div><div class="stat-label">Pairs</div></div>
  <div class="stat"><div class="stat-value" id="timer">0s</div><div class="stat-label">Time</div></div>
</div>
<div class="grid" id="grid"></div>
<div class="win-panel" id="win">
  <h2>All pairs found ✿</h2>
  <p id="win-sub"></p>
  <button onclick="startGame()">Play again</button>
</div>
<div class="btn-row"><button id="newbtn" onclick="startGame()">New game</button></div>
<a class="change-tiles" id="change-tiles-link" onclick="showTilesetPicker()" style="display:none;">⊞ Change tiles</a>
<div class="score-hint">Fewer moves + faster time = higher score</div>
<div class="status-msg" id="status"></div>
<div class="leaderboard">
  <div class="lb-header">
    <div class="lb-title">Best scores</div>
    <button class="btn-sm" onclick="clearScores()">Clear all</button>
  </div>
  <div id="lb-list"><div class="empty-msg">Loading scores...</div></div>
</div>

      { name:'Sunset', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sun1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a2080"/><stop offset="40%" stop-color="#e04820"/><stop offset="70%" stop-color="#f08820"/><stop offset="100%" stop-color="#f0c050"/></linearGradient></defs><rect width="100" height="110" fill="url(#sun1)"/><circle cx="50" cy="62" r="22" fill="#f8d040" opacity="0.9"/><rect x="0" y="72" width="100" height="38" fill="#1a3050" opacity="0.7"/><path d="M0,72 Q25,64 50,72 Q75,80 100,72" fill="#1a3050" opacity="0.5"/><path d="M10,78 Q20,74 30,78" stroke="#f8d040" stroke-width="1.5" fill="none" opacity="0.4"/><path d="M60,76 Q75,70 90,76" stroke="#f8d040" stroke-width="1.5" fill="none" opacity="0.4"/></svg>` },
      { name:'Forest', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="110" fill="#c8e0b0"/><polygon points="20,80 10,80 25,50 15,50 32,22 50,50 42,50" fill="#3a6a2a" opacity="0.8"/><polygon points="55,80 42,80 58,48 48,48 68,18 88,48 78,48 95,80" fill="#4a7a3a" opacity="0.7"/><rect x="28" y="80" width="8" height="18" fill="#7a5030" opacity="0.7"/><rect x="64" y="80" width="10" height="18" fill="#7a5030" opacity="0.7"/><rect x="0" y="88" width="100" height="22" fill="#5a8a3a" opacity="0.5"/></svg>` },
      { name:'Lake', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lake1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b0d0f0"/><stop offset="100%" stop-color="#d0eaf8"/></linearGradient></defs><rect width="100" height="110" fill="url(#lake1)"/><ellipse cx="50" cy="70" rx="46" ry="28" fill="#5090c0" opacity="0.5"/><ellipse cx="50" cy="70" rx="40" ry="22" fill="#60a8d8" opacity="0.4"/><path d="M18,66 Q30,60 42,66" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/><path d="M58,68 Q70,62 82,68" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/><polygon points="30,55 24,55 30,35 36,55" fill="#4a7a3a" opacity="0.7"/><polygon points="70,52 64,52 70,30 76,52" fill="#3a6a2a" opacity="0.7"/><circle cx="50" cy="18" r="12" fill="#f8d040" opacity="0.7"/></svg>` },
      { name:'Volcano', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="vol1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0a0a"/><stop offset="100%" stop-color="#2a1020"/></linearGradient></defs><rect width="100" height="110" fill="url(#vol1)"/><polygon points="50,18 5,95 95,95" fill="#5a4a3a" opacity="0.8"/><polygon points="50,18 35,50 65,50" fill="#3a3028" opacity="0.9"/><path d="M44,18 Q46,8 50,5 Q54,8 56,18" fill="#e04010" opacity="0.85"/><path d="M40,22 Q44,12 50,8 Q56,12 60,22 Q55,16 50,14 Q45,16 40,22Z" fill="#f86020" opacity="0.7"/><ellipse cx="50" cy="95" rx="46" ry="12" fill="#c03010" opacity="0.5"/><path d="M30,95 Q40,85 50,95" fill="#e04010" opacity="0.5"/><path d="M50,95 Q60,85 70,95" fill="#e04010" opacity="0.4"/></svg>` },
      { name:'Cherry Tree', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="70" width="100" height="40" fill="#a0c880" opacity="0.5"/><rect x="44" y="40" width="12" height="50" fill="#8a5a30" opacity="0.7"/><path d="M50,40 Q30,36 20,22 Q30,18 40,28 Q38,18 44,12 Q52,18 52,28 Q58,16 66,14 Q70,24 62,30 Q72,24 80,26 Q76,38 64,36 Q70,42 68,50 Q58,46 50,40Z" fill="#f4a0b8" opacity="0.6"/><path d="M50,40 Q40,36 34,28 Q42,24 50,32 Q58,24 66,28 Q60,36 50,40Z" fill="#fde0ea" opacity="0.5"/></svg>` },
      { name:'Desert', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="des1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8a820"/><stop offset="50%" stop-color="#f0c050"/><stop offset="100%" stop-color="#e8b840"/></linearGradient></defs><rect width="100" height="110" fill="url(#des1)"/><circle cx="75" cy="22" r="15" fill="#f8e040" opacity="0.9"/><path d="M0,70 Q15,60 20,70 Q25,80 30,70 Q40,55 50,70 Q60,85 70,70 Q80,55 85,70 Q90,80 100,70 L100,110 L0,110Z" fill="#e09820" opacity="0.6"/><line x1="20" y1="55" x2="20" y2="40" stroke="#5a8a2a" stroke-width="3"/><path d="M20,48 Q10,46 8,40" stroke="#5a8a2a" stroke-width="2.5" fill="none"/><path d="M20,52 Q30,50 32,44" stroke="#5a8a2a" stroke-width="2.5" fill="none"/><line x1="70" y1="50" x2="70" y2="35" stroke="#5a8a2a" stroke-width="3"/><path d="M70,43 Q60,41 58,35" stroke="#5a8a2a" stroke-width="2.5" fill="none"/><path d="M70,47 Q80,45 82,39" stroke="#5a8a2a" stroke-width="2.5" fill="none"/></svg>` },
      { name:'Waterfall', svg:`<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="55" fill="#4a7a3a" opacity="0.6"/><rect x="0" y="55" width="100" height="55" fill="#3a6080" opacity="0.5"/><rect x="30" y="0" width="20" height="55" fill="#8a9aaa" opacity="0.7"/><rect x="50" y="0" width="15" height="45" fill="#9aaaba" opacity="0.6"/><path d="M30,55 Q36,65 34,75 Q32,85 36,95" stroke="#b0d0f0" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/><path d="M40,55 Q44,68 42,80 Q40,90 44,100" stroke="#c0e0f8" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/><path d="M55,48 Q58,60 56,72 Q54,82 58,95" stroke="#b0d0f0" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/><ellipse cx="44" cy="100" rx="22" ry="8" fill="#5090c0" opacity="0.5"/></svg>` },
    ]
  }
};

// ─────────────────────────────────────────────
// BACK OF CARD
// ─────────────────────────────────────────────
const backSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:55%;height:55%;opacity:0.3">${[0,60,120,180,240,300].map(a=>{const r=a*Math.PI/180;return`<ellipse cx="${(50+Math.cos(r)*18).toFixed(1)}" cy="${(46+Math.sin(r)*18).toFixed(1)}" rx="9" ry="14" fill="#b5697a" opacity="0.6" transform="rotate(${a} ${(50+Math.cos(r)*18).toFixed(1)} ${(46+Math.sin(r)*18).toFixed(1)})"/>`;}).join('')}<circle cx="50" cy="46" r="9" fill="#c9a96e" opacity="0.7"/><line x1="50" y1="60" x2="50" y2="80" stroke="#6a9a6a" stroke-width="2.5" stroke-linecap="round"/></svg>`;

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let flipped=[],matched=0,moves=0,lock=false,timerVal=0,timerInterval,scores=[],lastScoreIndex=-1;
let currentUser = { name:'', avatarId:'' };
let currentSetId = 'flowers';
let pendingSetId = 'flowers';

// ─────────────────────────────────────────────
// PROFILE
// ─────────────────────────────────────────────
function initAvatarGrid() {
  const grid = document.getElementById('avatar-grid');
  grid.innerHTML = avatars.map(a=>`<div class="avatar-opt" data-id="${a.id}" onclick="selectAvatar('${a.id}')">${a.svg}</div>`).join('');
  selectAvatar(avatars[0].id);
}

function selectAvatar(id) {
  document.querySelectorAll('.avatar-opt').forEach(el=>el.classList.toggle('selected', el.dataset.id===id));
  currentUser.avatarId = id;
}

function getAvatarSVG(id) {
  return (avatars.find(x=>x.id===id)||avatars[0]).svg;
}

function saveProfile() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  currentUser.name = name;
  localStorage.setItem('garden_user', JSON.stringify(currentUser));
  document.getElementById('profile-overlay').classList.add('hidden');
  showTilesetPicker();
}

function loadProfile() {
  const saved = localStorage.getItem('garden_user');
  if (saved) { try { currentUser = JSON.parse(saved); } catch(e){} }
  if (currentUser.name) return true;
  initAvatarGrid();
  document.getElementById('profile-overlay').classList.remove('hidden');
  return false;
}

// ─────────────────────────────────────────────
// TILE SET PICKER
// ─────────────────────────────────────────────
function showTilesetPicker() {
  pendingSetId = currentSetId;
  const grid = document.getElementById('tileset-grid');
  grid.innerHTML = Object.values(tileSets).map(ts => {
    const preview = ts.tiles.slice(0,4).map(t=>`<div>${t.svg}</div>`).join('');
    return `<div class="tileset-card ${ts.id===pendingSetId?'selected':''}" onclick="selectTileset('${ts.id}')">
      <div class="tileset-name">${ts.emoji} ${ts.name}</div>
      <div style="font-size:0.68rem;color:#9a8a8a;margin-bottom:0.5rem;letter-spacing:0.05em;">${ts.desc}</div>
      <div class="tileset-preview">${preview}</div>
    </div>`;
  }).join('');
  document.getElementById('tileset-overlay').classList.remove('hidden');
}

function selectTileset(id) {
  pendingSetId = id;
  document.querySelectorAll('.tileset-card').forEach(el=>{
    el.classList.toggle('selected', el.dataset && el.onclick.toString().includes(`'${id}'`));
  });
  // re-render to update selected state cleanly
  const grid = document.getElementById('tileset-grid');
  grid.innerHTML = Object.values(tileSets).map(ts => {
    const preview = ts.tiles.slice(0,4).map(t=>`<div>${t.svg}</div>`).join('');
    return `<div class="tileset-card ${ts.id===pendingSetId?'selected':''}" onclick="selectTileset('${ts.id}')">
      <div class="tileset-name">${ts.emoji} ${ts.name}</div>
      <div style="font-size:0.68rem;color:#9a8a8a;margin-bottom:0.5rem;letter-spacing:0.05em;">${ts.desc}</div>
      <div class="tileset-preview">${preview}</div>
    </div>`;
  }).join('');
}

function confirmTileset() {
  currentSetId = pendingSetId;
  document.getElementById('tileset-overlay').classList.add('hidden');
  const setName = tileSets[currentSetId].name;
  document.getElementById('header-sub').textContent = `Find each matching pair · ${setName}`;
  document.getElementById('change-tiles-link').style.display = 'block';
  startGame();
}

// ─────────────────────────────────────────────
// SCORES
// ─────────────────────────────────────────────
function setStatus(msg){ document.getElementById('status').textContent=msg; }

async function loadScores() {
  setStatus('Loading scores...');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{'X-Access-Key':API_KEY}});
    if (res.ok) { const data=await res.json(); scores=data.record.scores||[]; setStatus(''); }
    else { setStatus('Could not load scores.'); }
  } catch(e) { setStatus('Could not load scores.'); }
  renderLB();
}

async function saveScores() {
  setStatus('Saving score...');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Access-Key':API_KEY},body:JSON.stringify({scores})});
    if (res.ok) { setStatus('Score saved! ✿'); }
    else { setStatus('Could not save score.'); }
  } catch(e) { setStatus('Could not save score.'); }
  setTimeout(()=>setStatus(''),3000);
}

async function clearScores() {
  if (!confirm('Clear all saved scores?')) return;
  scores=[]; lastScoreIndex=-1;
  await saveScores(); renderLB();
}

function renderLB() {
  const el = document.getElementById('lb-list');
  if (!scores.length) { el.innerHTML='<div class="empty-msg">Finish a game to see your score</div>'; return; }
  const medals=['🥇','🥈','🥉'];
  el.innerHTML=scores.map((s,i)=>`
    <div class="lb-row ${i===lastScoreIndex?'is-new':''}">
      <span class="lb-rank">${medals[i]||i+1}</span>
      <div class="lb-user">
        <div class="lb-avatar">${getAvatarSVG(s.avatarId||'')}</div>
        <span class="lb-name">${s.name||'Anonymous'}${i===lastScoreIndex?'<span class="new-tag">new</span>':''}</span>
      </div>
      <span class="lb-pts">${s.score} pts</span>
      <span class="lb-detail">${s.moves}m · ${s.time}s · ${s.date}</span>
    </div>`).join('');
}

// ─────────────────────────────────────────────
// GAME
// ─────────────────────────────────────────────
function calcScore(m,t){ return Math.max(50,Math.round(1000-m*10-t*2)); }
function shuffle(arr){ return [...arr,...arr].sort(()=>Math.random()-0.5); }

function startGame() {
  clearInterval(timerInterval);
  flipped=[]; matched=0; moves=0; lock=false; timerVal=0; lastScoreIndex=-1;
  document.getElementById('moves').textContent='0';
  document.getElementById('pairs').textContent='0/8';
  document.getElementById('timer').textContent='0s';
  document.getElementById('win').style.display='none';
  document.getElementById('newbtn').style.display='inline-block';
  document.getElementById('change-tiles-link').style.display='block';
  const grid=document.getElementById('grid');
  grid.style.display='grid'; grid.innerHTML='';
  const tiles = tileSets[currentSetId].tiles;
  shuffle(tiles).forEach(f=>{
    const card=document.createElement('div');
    card.className='card'; card.dataset.name=f.name;
    card.innerHTML=`<div class="card-face card-back">${backSVG}</div><div class="card-face card-front">${f.svg}<div class="fname">${f.name}</div></div>`;
    card.onclick=()=>flipCard(card);
    grid.appendChild(card);
  });
  timerInterval=setInterval(()=>{ timerVal++; document.getElementById('timer').textContent=timerVal+'s'; },1000);
}

function flipCard(card) {
  if (lock||card.classList.contains('flipped')||card.classList.contains('matched')) return;
  card.classList.add('flipped'); flipped.push(card);
  if (flipped.length===2) {
    lock=true; moves++;
    document.getElementById('moves').textContent=moves;
    if (flipped[0].dataset.name===flipped[1].dataset.name) {
      flipped[0].classList.add('matched'); flipped[1].classList.add('matched');
      matched++; document.getElementById('pairs').textContent=matched+'/8';
      flipped=[]; lock=false;
      if (matched===8) {
        clearInterval(timerInterval);
        const score=calcScore(moves,timerVal);
        const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
        const entry={score,moves,time:timerVal,date,name:currentUser.name,avatarId:currentUser.avatarId,set:currentSetId};
        scores.push(entry); scores.sort((a,b)=>b.score-a.score);
        if (scores.length>10) scores=scores.slice(0,10);
        lastScoreIndex=scores.findIndex(s=>s===entry);
        saveScores();
        setTimeout(()=>{
          document.getElementById('grid').style.display='none';
          document.getElementById('newbtn').style.display='none';
          document.getElementById('change-tiles-link').style.display='none';
          document.getElementById('win-sub').textContent=`${moves} moves · ${timerVal} seconds · ${score} points`;
          document.getElementById('win').style.display='block';
          renderLB();
        },700);
      }
    } else {
      setTimeout(()=>{ flipped[0].classList.remove('flipped'); flipped[1].classList.remove('flipped'); flipped=[]; lock=false; },1000);
    }
  }
}

loadScores().then(()=>{ if(loadProfile()) showTilesetPicker(); });
</script>
</body>
</html>

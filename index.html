<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden of Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost',sans-serif;background:#faf6f0;color:#3a2e2e;min-height:100vh;padding:2rem 1rem 4rem;}
header{text-align:center;margin-bottom:2rem;}
header h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:0.04em;}
header h1 em{font-style:italic;color:#b5697a;}
header p{font-size:0.72rem;color:#9a8a8a;letter-spacing:0.14em;text-transform:uppercase;margin-top:0.4rem;}
.divider{width:60px;height:1px;background:#c9a96e;margin:0.8rem auto;opacity:0.6;}
.stats{display:flex;justify-content:center;gap:2.5rem;margin-bottom:1.8rem;}
.stat{text-align:center;}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:#8b4a4a;line-height:1;}
.stat-label{font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:#9a8a8a;margin-top:2px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:540px;margin:0 auto 1.5rem;}
.card{aspect-ratio:1;border-radius:16px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(.4,0,.2,1);}
.card:hover:not(.flipped):not(.matched){transform:translateY(-4px) scale(1.03);}
.card.flipped,.card.matched{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.card-back{background:#f0e8e2;border:1px solid rgba(181,105,122,0.2);}
.card-front{transform:rotateY(180deg);background:#fff;border:1px solid rgba(181,105,122,0.15);}
.card-front svg{width:80%;height:80%;}
.card-front .fname{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.72rem;color:#8b4a5a;padding-bottom:4px;}
.card.matched .card-front{background:#f5faf5;border-color:#7a9a7a;}
.card.matched .fname{color:#4a7a4a;}
.btn-row{text-align:center;margin-bottom:2rem;}
button{font-family:'Jost',sans-serif;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;background:transparent;border:1px solid #b5697a;color:#8b4a4a;padding:10px 28px;border-radius:30px;cursor:pointer;transition:all 0.2s;}
button:hover{background:#b5697a;color:white;}
button.btn-sm{font-size:0.62rem;padding:6px 16px;border-color:#9a8a8a;color:#9a8a8a;}
button.btn-sm:hover{background:#9a8a8a;color:white;}
.win-panel{display:none;text-align:center;padding:2.5rem 2rem;max-width:400px;margin:0 auto 2rem;}
.win-panel h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2rem;color:#8b4a4a;margin-bottom:0.5rem;}
.win-panel p{font-size:0.85rem;color:#9a8a8a;margin-bottom:1.5rem;}
.leaderboard{max-width:460px;margin:0 auto;border-top:1px solid rgba(181,105,122,0.2);padding-top:2rem;}
.lb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.lb-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-style:italic;font-weight:300;}
.lb-row{display:flex;align-items:center;padding:9px 14px;border-radius:10px;margin-bottom:4px;font-size:0.85rem;}
.lb-row.is-new{background:rgba(181,105,122,0.08);}
.lb-rank{width:28px;font-size:1.1rem;}
.lb-pts{flex:1;color:#3a2e2e;}
.lb-detail{font-size:0.72rem;color:#9a8a8a;}
.new-tag{font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;background:#b5697a;color:white;border-radius:10px;padding:2px 8px;margin-left:8px;vertical-align:middle;}
.empty-msg{text-align:center;font-size:0.85rem;color:#9a8a8a;font-style:italic;padding:1rem 0;}
.score-hint{text-align:center;font-size:0.7rem;color:#9a8a8a;margin-bottom:1.5rem;letter-spacing:0.05em;}
.status-msg{text-align:center;font-size:0.72rem;color:#9a8a8a;margin-bottom:0.5rem;min-height:1.2em;}
</style>
</head>
<body>
<header>
  <h1>Garden of <em>Memories</em></h1>
  <div class="divider"></div>
  <p>Find each matching pair of flowers</p>
</header>
<div class="stats">
  <div class="stat"><div class="stat-value" id="moves">0</div><div class="stat-label">Moves</div></div>
  <div class="stat"><div class="stat-value" id="pairs">0/8</div><div class="stat-label">Pairs</div></div>
  <div class="stat"><div class="stat-value" id="timer">0s</div><div class="stat-label">Time</div></div>
</div>
<div class="grid" id="grid"></div>
<div class="win-panel" id="win">
  <h2>Your garden is complete ✿</h2>
  <p id="win-sub"></p>
  <button onclick="startGame()">Play again</button>
</div>
<div class="btn-row"><button id="newbtn" onclick="startGame()">New game</button></div>
<div class="score-hint">Fewer moves + faster time = higher score</div>
<div class="status-msg" id="status"></div>
<div class="leaderboard">
  <div class="lb-header">
    <div class="lb-title">Best scores</div>
    <button class="btn-sm" onclick="clearScores()">Clear all</button>
  </div>
  <div id="lb-list"><div class="empty-msg">Loading scores...</div></div>
</div>

<script>
const API_KEY = '$2a$10$mt2BLyUrJsR1jrvwdB/rBOqzh831NVxDEhHS6s7qbZIfMwwfzdiqO';
const BIN_NAME = 'garden-memory-scores';
let BIN_ID = localStorage.getItem('garden-bin-id') || null;

const flowers = [
  { name: 'Rose', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="80" x2="50" y2="108" stroke="#5a8a5a" stroke-width="2.5" stroke-linecap="round"/><path d="M50,82 Q38,78 36,70" stroke="#5a8a5a" stroke-width="1.5" fill="none" stroke-linecap="round"/><ellipse cx="33" cy="68" rx="9" ry="5" fill="#7ab87a" opacity="0.7" transform="rotate(-30 33 68)"/><ellipse cx="50" cy="52" rx="28" ry="28" fill="#e8a0a0" opacity="0.18"/><ellipse cx="50" cy="54" rx="22" ry="22" fill="#dd8888" opacity="0.22"/><path d="M50,75 Q32,70 28,56 Q24,40 36,32 Q44,26 50,30 Q56,26 64,32 Q76,40 72,56 Q68,70 50,75Z" fill="#d4606a" opacity="0.55"/><path d="M50,75 Q38,66 38,54 Q38,40 50,36 Q62,40 62,54 Q62,66 50,75Z" fill="#e07880" opacity="0.55"/><path d="M50,36 Q56,28 64,32 Q70,38 66,50 Q60,42 50,42Z" fill="#f0a0a8" opacity="0.5"/><path d="M50,36 Q44,28 36,32 Q30,38 34,50 Q40,42 50,42Z" fill="#f0a0a8" opacity="0.45"/><path d="M50,42 Q58,38 62,46 Q58,50 50,50 Q42,50 38,46 Q42,38 50,42Z" fill="#f5b8be" opacity="0.6"/><ellipse cx="50" cy="47" rx="7" ry="5" fill="#fde0e4" opacity="0.55"/></svg>` },
  { name: 'Sunflower', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="78" x2="50" y2="108" stroke="#4a7a3a" stroke-width="2.5" stroke-linecap="round"/>${[0,22.5,45,67.5,90,112.5,135,157.5,180,202.5,225,247.5,270,292.5,315,337.5].map(a=>{const r=a*Math.PI/180,x=50+Math.cos(r)*26,y=46+Math.sin(r)*26;return`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="5" ry="13" fill="#f5c842" opacity="0.55" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}).join('')}<circle cx="50" cy="46" r="16" fill="#6b3a1f" opacity="0.75"/><circle cx="50" cy="46" r="13" fill="#7a4428" opacity="0.6"/><circle cx="50" cy="46" r="10" fill="#8b5030" opacity="0.5"/></svg>` },
  { name: 'Tulip', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="78" x2="50" y2="108" stroke="#4a8a4a" stroke-width="2.5" stroke-linecap="round"/><path d="M36,64 Q26,58 28,50" stroke="#388e3c" stroke-width="1.5" fill="none" stroke-linecap="round"/><ellipse cx="25" cy="49" rx="7" ry="3.5" fill="#66bb6a" opacity="0.65" transform="rotate(-25 25 49)"/><path d="M50,78 Q34,72 30,54 Q26,34 38,22 Q44,16 50,18 Q56,16 62,22 Q74,34 70,54 Q66,72 50,78Z" fill="#e07090" opacity="0.45"/><path d="M50,78 Q36,68 36,52 Q36,32 50,24 Q64,32 64,52 Q64,68 50,78Z" fill="#d05878" opacity="0.45"/><path d="M50,24 Q58,16 66,22 Q74,30 70,46 Q62,34 50,34Z" fill="#f090a8" opacity="0.45"/><path d="M50,24 Q42,16 34,22 Q26,30 30,46 Q38,34 50,34Z" fill="#f090a8" opacity="0.38"/><path d="M50,34 Q58,30 64,40 Q58,48 50,50 Q42,48 36,40 Q42,30 50,34Z" fill="#f8b8c8" opacity="0.5"/></svg>` },
  { name: 'Lavender', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="72" x2="50" y2="108" stroke="#5a8a4a" stroke-width="2" stroke-linecap="round"/><path d="M50,72 Q38,66 34,54" stroke="#5a8a4a" stroke-width="1.4" fill="none" stroke-linecap="round"/><ellipse cx="31" cy="52" rx="9" ry="4" fill="#7ab86a" opacity="0.6" transform="rotate(-25 31 52)"/><path d="M50,72 Q62,66 66,54" stroke="#5a8a4a" stroke-width="1.4" fill="none" stroke-linecap="round"/><ellipse cx="69" cy="52" rx="9" ry="4" fill="#7ab86a" opacity="0.6" transform="rotate(25 69 52)"/>${[0,1,2,3,4,5,6,7,8].map(i=>{const y=10+i*7,ox=(i%2===0?-4:4),op=0.35+i*0.04;return`<ellipse cx="${50+ox}" cy="${y}" rx="6" ry="4.5" fill="#a070c8" opacity="${op.toFixed(2)}" transform="rotate(${ox>0?8:-8} ${50+ox} ${y})"/><ellipse cx="${50+ox}" cy="${y}" rx="4" ry="3" fill="#c090e0" opacity="${(op*0.7).toFixed(2)}" transform="rotate(${ox>0?8:-8} ${50+ox} ${y})"/>`;}).join('')}</svg>` },
  { name: 'Daisy', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="76" x2="50" y2="108" stroke="#4a8a4a" stroke-width="2.5" stroke-linecap="round"/><path d="M50,78 Q38,74 36,64" stroke="#4a8a4a" stroke-width="1.5" fill="none" stroke-linecap="round"/><ellipse cx="33" cy="62" rx="9" ry="4.5" fill="#6ab86a" opacity="0.65" transform="rotate(-25 33 62)"/>${[0,20,40,60,80,100,120,140,160,180,200,220,240,260,280,300,320,340].map(a=>{const r=a*Math.PI/180,x=50+Math.cos(r)*24,y=44+Math.sin(r)*24;return`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4.5" ry="12" fill="white" opacity="0.8" stroke="#e8d8d0" stroke-width="0.5" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}).join('')}<circle cx="50" cy="44" r="13" fill="#f5d030" opacity="0.75"/><circle cx="50" cy="44" r="9" fill="#e8b010" opacity="0.55"/></svg>` },
  { name: 'Cherry Blossom', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="76" x2="50" y2="108" stroke="#7a5540" stroke-width="2.5" stroke-linecap="round"/>${[0,72,144,216,288].map(a=>{const r=a*Math.PI/180,x=50+Math.cos(r)*22,y=44+Math.sin(r)*22;return`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="12" ry="16" fill="#f4a0b8" opacity="0.42" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/><ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="8" ry="11" fill="#fde0ea" opacity="0.38" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}).join('')}<circle cx="50" cy="44" r="8" fill="#fff8f0" opacity="0.8"/><circle cx="50" cy="44" r="3.5" fill="#f8d030" opacity="0.8"/></svg>` },
  { name: 'Orchid', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="78" x2="50" y2="108" stroke="#4a8a4a" stroke-width="2" stroke-linecap="round"/><path d="M50,78 Q34,72 28,56 Q22,38 34,28 Q42,22 50,28Z" fill="#c880d0" opacity="0.42"/><path d="M50,78 Q66,72 72,56 Q78,38 66,28 Q58,22 50,28Z" fill="#b870c0" opacity="0.42"/><path d="M50,28 Q40,16 32,18 Q24,20 28,30 Q32,24 44,32Z" fill="#e0a8e8" opacity="0.45"/><path d="M50,28 Q60,16 68,18 Q76,20 72,30 Q68,24 56,32Z" fill="#d098e0" opacity="0.42"/><path d="M50,28 Q44,14 50,8 Q56,14 50,28Z" fill="#b860c8" opacity="0.48"/><ellipse cx="50" cy="44" rx="10" ry="7" fill="#fdf0a0" opacity="0.7"/><circle cx="50" cy="42" r="3" fill="#e8a820" opacity="0.6"/></svg>` },
  { name: 'Poppy', svg: `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="78" x2="50" y2="108" stroke="#4a8a4a" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="50" cy="46" rx="30" ry="30" fill="#e85030" opacity="0.22"/><path d="M50,76 Q26,70 22,50 Q18,28 34,20 Q42,14 50,18 Q58,14 66,20 Q82,28 78,50 Q74,70 50,76Z" fill="#d03820" opacity="0.45"/><path d="M50,18 Q62,10 72,20 Q82,32 74,50 Q64,30 50,30Z" fill="#f07060" opacity="0.4"/><path d="M50,18 Q38,10 28,20 Q18,32 26,50 Q36,30 50,30Z" fill="#f06050" opacity="0.35"/><circle cx="50" cy="46" r="12" fill="#282820" opacity="0.72"/><circle cx="50" cy="46" r="9" fill="#303828" opacity="0.6"/></svg>` },
];

const backSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:55%;height:55%;opacity:0.3">${[0,60,120,180,240,300].map(a=>{const r=a*Math.PI/180;return`<ellipse cx="${(50+Math.cos(r)*18).toFixed(1)}" cy="${(46+Math.sin(r)*18).toFixed(1)}" rx="9" ry="14" fill="#b5697a" opacity="0.6" transform="rotate(${a} ${(50+Math.cos(r)*18).toFixed(1)} ${(46+Math.sin(r)*18).toFixed(1)})"/>`;}).join('')}<circle cx="50" cy="46" r="9" fill="#c9a96e" opacity="0.7"/><line x1="50" y1="60" x2="50" y2="80" stroke="#6a9a6a" stroke-width="2.5" stroke-linecap="round"/></svg>`;

let flipped=[],matched=0,moves=0,lock=false,timerVal=0,timerInterval,scores=[],lastScoreIndex=-1;

function setStatus(msg){ document.getElementById('status').textContent = msg; }

async function loadScores() {
  setStatus('Loading scores...');
  if (!BIN_ID) { setStatus(''); renderLB(); return; }
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Access-Key': API_KEY }
    });
    if (res.ok) {
      const data = await res.json();
      scores = data.record.scores || [];
      setStatus('');
    } else {
      setStatus('Could not load scores.');
    }
  } catch(e) { setStatus('Could not load scores.'); }
  renderLB();
}

async function saveScores() {
  setStatus('Saving score...');
  try {
    if (!BIN_ID) {
      // Create a new bin
      const res = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Key': API_KEY,
          'X-Bin-Name': 'garden-memory-scores',
          'X-Bin-Private': 'false'
        },
        body: JSON.stringify({ scores })
      });
      if (res.ok) {
        const data = await res.json();
        BIN_ID = data.metadata.id;
        localStorage.setItem('garden-bin-id', BIN_ID);
        setStatus('Score saved! ✿');
      } else { setStatus('Could not save score.'); }
    } else {
      // Update existing bin
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Key': API_KEY
        },
        body: JSON.stringify({ scores })
      });
      if (res.ok) { setStatus('Score saved! ✿'); }
      else { setStatus('Could not save score.'); }
    }
  } catch(e) { setStatus('Could not save score.'); }
  setTimeout(()=>setStatus(''), 3000);
}

async function clearScores() {
  if (!confirm('Clear all saved scores?')) return;
  scores = []; lastScoreIndex = -1;
  if (BIN_ID) await saveScores();
  renderLB();
}

function renderLB() {
  const el = document.getElementById('lb-list');
  if (!scores.length) { el.innerHTML = '<div class="empty-msg">Finish a game to see your score</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = scores.map((s,i) => `
    <div class="lb-row ${i===lastScoreIndex?'is-new':''}">
      <span class="lb-rank">${medals[i]||i+1}</span>
      <span class="lb-pts">${s.score} pts${i===lastScoreIndex?'<span class="new-tag">new</span>':''}</span>
      <span class="lb-detail">${s.moves} moves · ${s.time}s · ${s.date}</span>
    </div>`).join('');
}

function calcScore(m,t){ return Math.max(50, Math.round(1000 - m*10 - t*2)); }
function shuffle(arr){ return [...arr,...arr].sort(()=>Math.random()-0.5); }

function startGame() {
  clearInterval(timerInterval);
  flipped=[]; matched=0; moves=0; lock=false; timerVal=0; lastScoreIndex=-1;
  document.getElementById('moves').textContent='0';
  document.getElementById('pairs').textContent='0/8';
  document.getElementById('timer').textContent='0s';
  document.getElementById('win').style.display='none';
  document.getElementById('newbtn').style.display='inline-block';
  const grid = document.getElementById('grid');
  grid.style.display='grid'; grid.innerHTML='';
  shuffle(flowers).forEach(f => {
    const card = document.createElement('div');
    card.className='card'; card.dataset.name=f.name;
    card.innerHTML=`<div class="card-face card-back">${backSVG}</div><div class="card-face card-front">${f.svg}<div class="fname">${f.name}</div></div>`;
    card.onclick = () => flipCard(card);
    grid.appendChild(card);
  });
  timerInterval = setInterval(()=>{ timerVal++; document.getElementById('timer').textContent=timerVal+'s'; }, 1000);
}

function flipCard(card) {
  if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped'); flipped.push(card);
  if (flipped.length===2) {
    lock=true; moves++;
    document.getElementById('moves').textContent=moves;
    if (flipped[0].dataset.name===flipped[1].dataset.name) {
      flipped[0].classList.add('matched'); flipped[1].classList.add('matched');
      matched++; document.getElementById('pairs').textContent=matched+'/8';
      flipped=[]; lock=false;
      if (matched===8) {
        clearInterval(timerInterval);
        const score = calcScore(moves, timerVal);
        const date = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
        const entry = {score, moves, time:timerVal, date};
        scores.push(entry); scores.sort((a,b)=>b.score-a.score);
        if (scores.length>10) scores=scores.slice(0,10);
        lastScoreIndex = scores.findIndex(s=>s===entry);
        saveScores();
        setTimeout(()=>{
          document.getElementById('grid').style.display='none';
          document.getElementById('newbtn').style.display='none';
          document.getElementById('win-sub').textContent=`${moves} moves · ${timerVal} seconds · ${score} points`;
          document.getElementById('win').style.display='block';
          renderLB();
        }, 700);
      }
    } else {
      setTimeout(()=>{ flipped[0].classList.remove('flipped'); flipped[1].classList.remove('flipped'); flipped=[]; lock=false; }, 1000);
    }
  }
}

loadScores().then(()=>startGame());
</script>
</body>
</html>
